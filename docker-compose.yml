services:
  postgres:
    image: postgres:16-alpine
    container_name: voa-postgres
    environment:
      POSTGRES_DB: voa
      POSTGRES_USER: voa
      POSTGRES_PASSWORD: voa_dev
    ports:
      - "5433:5432"
    volumes:
      - voa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voa -d voa"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      VOA_SEED_ADMIN_EMAIL: admin@jlturismo.local
      VOA_SEED_ADMIN_PASSWORD: AdminSenhaSegura12
      JWT_ACCESS_SECRET: change-me-in-docker-use-a-long-random-secret
      PUBLIC_BASE_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  voa_pg_data:
