services:
  postgres:
    image: postgres:16-alpine
    container_name: voa-postgres
    environment:
      POSTGRES_DB: voa
      POSTGRES_USER: voa
      POSTGRES_PASSWORD: voa_dev
    ports:
      - "5433:5432"
    volumes:
      - voa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voa -d voa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  voa_pg_data:
